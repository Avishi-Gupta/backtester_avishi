[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "0.1.0"
description = "A signal backtesting harness that is paranoid about look-ahead bias"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["backtester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
